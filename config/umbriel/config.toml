[general]
xwayland = true
xwayland_native_resolution = false
show_cheatsheet = false

[include]
files = [
    "input.toml",
    "binds.toml",
    "rules.toml",
]

# Machine-specific files
[include.optional]
files = [
    "local/input.toml",
    "local/general.toml",
    "local/rules.toml",
    "local/outputs.toml",
    "noctalia.toml",
]

[environment]
ELECTRON_OZONE_PLATFORM_HINT = "auto"
SDL_VIDEODRIVER = "wayland"
XCURSOR_THEME = "Bibata-Modern-Ice"
PROTON_PASS_KEY_PROVIDER = "keyring"
PROTON_PASS_LINUX_KEYRING = "dbus"

[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 10
drag_opacity = 0.95
opaque_fullscreen = true

[appearance.blur]
enabled = true
optimized = false
passes = 1
radius = 4
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[appearance.shadow]
enabled = true
softness = 10
offset_x = 2
offset_y = 2
