palette = "noctalia"
format = """
$hostname$username\
$directory\

$localip\
$shlvl\
$singularity\
$kubernetes\
$vcsh\
$hg_branch\
$docker_context\
$package\
$custom\

$sudo\

$fill\
$git_branch\
$git_status\
$git_commit\
$cmd_duration\
$jobs\
$battery\
$time\
$status\
$os\
$container\
$shell\
$line_break\
$character"""


# Disable the blank line at the start of the prompt
add_newline = true

# Second param
[hostname]
ssh_only = false
format = "[](fg:surface1 bg:none)[$hostname](bg:surface1)"
disabled = false

[username]
format = "[  ](fg:yellow bg:surface1)[$user ]($style)[](fg:yellow bg:surface1)[ ](fg:surface1 bg:yellow)[](fg:yellow bg:none) "
style_user = "fg:white bg:surface1"
style_root = "fg:red bg:surface1"
show_always = true

# Third param
[directory]
format = "[](fg:surface1 bg:none)[$path]($style)[█](fg:surface1 bg:surface1)[](fg:blue bg:surface1)[ ](fg:surface1 bg:blue)[](fg:blue bg:none)"
style = "italic fg:white bg:surface1"
truncation_length = 3
truncate_to_repo=false
read_only = " "

## SECOND LINE/ROW: Prompt
# Prompt: param 2 └─
[character]
success_symbol = "[󱞪 ](magenta)"
error_symbol = "[󱞪 ](red)"

[line_break]
disabled = false

[fill]
symbol = ' '

[cmd_duration]
min_time = 1
format = "[](fg:surface1 bg:none)[$duration]($style)[](fg:surface1 bg:surface1)[](fg:magenta bg:surface1)[󰥔 ](fg:surface1 bg:magenta)[](fg:magenta bg:none)"
disabled = false
style = "fg:white bg:surface1"


[git_branch]
format = "[](fg:surface1 bg:none)[$branch]($style)[](fg:surface1 bg:surface1)[](fg:green bg:surface1)[ ](fg:surface1 bg:green)[](fg:green bg:none) "
style = "fg:white bg:surface1"
symbol = " "

[git_status]
format="[](fg:surface1 bg:none)[$all_status$ahead_behind]($style)[](fg:surface1 bg:surface1)[](fg:blue bg:surface1)[ ](fg:surface1 bg:blue)[](fg:blue bg:none) "
style = "fg:white bg:surface1"
conflicted = "="
ahead =	"⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = " 󰄸 "
untracked = "?${count}"
stashed = ""
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = " ${count}"

[git_commit]
format = "[\\($hash\\)]($style) [\\($tag\\)]($style)"
style = "green"

[git_state]
rebase = "REBASING"
merge =	"MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"
style =	"yellow"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

# # SYMBOLS

[aws]
symbol = "  "

[conda]
symbol = " "

[dart]
symbol = " "

# [directory]

[docker_context]
symbol = " "
format = "via [$symbol$context]($style) "
style = "blue"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]
detect_folders = []
disabled = false

[elixir]
symbol = " "

[elm]
symbol = " "

[golang]
symbol = " "

[hg_branch]
symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[haskell]
symbol = "λ "

[memory_usage]
symbol = " "

[nim]
symbol = " "

[nix_shell]
symbol = " "

[package]
symbol = " "

[perl]
symbol = " "

[php]
symbol = " "

[python]
symbol = " "
#pyenv_version_name = true
format = 'via [${symbol}python (${version} )(\($virtualenv\) )]($style)'
style = "yellow"
pyenv_prefix = "venv "
python_binary = ["./venv/bin/python", "python", "python3", "python2"]
detect_extensions = ["py"]
version_format = "v${raw}"

[ruby]
symbol = " "

[rust]
symbol = " "

[scala]
symbol = " "

[shlvl]
symbol = " "

[swift]
symbol = "ﯣ "

[nodejs]
format = "via [ Node.js $version](green) "
detect_files = ["package.json", ".node-version"]
detect_folders = ["node_modules"]

# Other languages configurations:
c.disabled = true
cmake.disabled = true
haskell.disabled = true
python.disabled = true
ruby.disabled = true
rust.disabled = true
perl.disabled = true
package.disabled = true
lua.disabled = true
nodejs.disabled = true
java.disabled = true
golang.disabled = true

