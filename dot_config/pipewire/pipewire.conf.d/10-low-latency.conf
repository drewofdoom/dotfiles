context.properties = {   
    # Reduce context switching overhead
    link.max-buffers = 64
    
    # Improve real-time performance
    core.daemon = true
    core.name = pipewire-0
}

context.modules = [
    {
        name = libpipewire-module-rtkit
        args = {
            nice.level = -11
            rt.prio = 88
            rt.time.soft = 2000000
            rt.time.hard = 2000000
        }
        flags = [ ifexists nofail ]
    }
]